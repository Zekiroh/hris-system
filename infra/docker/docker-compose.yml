services:
  mysql:
    image: mysql:8.0
    container_name: hris-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${HRIS_MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${HRIS_MYSQL_DATABASE:-hris_db}
      MYSQL_USER: ${HRIS_MYSQL_USER:-hris_user}
      MYSQL_PASSWORD: ${HRIS_MYSQL_PASSWORD:-hris_password}
    ports:
      - "${HRIS_MYSQL_HOST:-127.0.0.1}:${HRIS_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci

volumes:
  mysql_data:
